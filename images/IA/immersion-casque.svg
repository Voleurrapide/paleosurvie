<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
    <defs>
        <!-- Gradients -->
        <radialGradient id="survivorGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00ff41" stop-opacity="0.3"/>
            <stop offset="60%" stop-color="#00ff41" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="headsetLight" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#73ff97"/>
            <stop offset="50%" stop-color="#00ff41"/>
            <stop offset="100%" stop-color="#005515"/>
        </radialGradient>
        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e2c20"/>
            <stop offset="50%" stop-color="#101912"/>
            <stop offset="100%" stop-color="#070c08"/>
        </linearGradient>
        <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00ff41" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#008f24" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#002209" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
            <stop offset="50%" stop-color="#00ff41" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
        </linearGradient>
        <!-- Filter glow -->
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background circle / radar -->
    <rect width="320" height="320" fill="#040905" rx="160"/>
    <circle cx="160" cy="160" r="150" fill="url(#survivorGlow)"/>
    <circle cx="160" cy="160" r="145" fill="none" stroke="#0f2b15" stroke-width="2"/>
    <circle cx="160" cy="160" r="130" fill="none" stroke="#00ff41" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 6"/>
    <circle cx="160" cy="160" r="95" fill="none" stroke="#00ff41" stroke-width="1" stroke-opacity="0.15"/>

    <!-- Radar Crosshairs -->
    <line x1="160" y1="12" x2="160" y2="40" stroke="#00ff41" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="160" y1="280" x2="160" y2="308" stroke="#00ff41" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="12" y1="160" x2="40" y2="160" stroke="#00ff41" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="280" y1="160" x2="308" y2="160" stroke="#00ff41" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Audio Frequency Waves (Soundwaves background) -->
    <!-- Left Waves -->
    <path d="M 45 150 Q 55 140 65 150 T 85 150" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-opacity="0.5" filter="url(#neonGlow)"/>
    <path d="M 35 160 Q 50 145 65 160 T 95 160" fill="none" stroke="#00ff41" stroke-width="2" stroke-opacity="0.75" filter="url(#neonGlow)"/>
    <path d="M 45 170 Q 55 180 65 170 T 85 170" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-opacity="0.5" filter="url(#neonGlow)"/>
    
    <!-- Right Waves -->
    <path d="M 235 150 Q 255 140 265 150 T 285 150" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-opacity="0.5" filter="url(#neonGlow)"/>
    <path d="M 225 160 Q 245 145 255 160 T 295 160" fill="none" stroke="#00ff41" stroke-width="2" stroke-opacity="0.75" filter="url(#neonGlow)"/>
    <path d="M 235 170 Q 255 180 265 170 T 285 170" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-opacity="0.5" filter="url(#neonGlow)"/>

    <!-- Concentric audio pulses behind headphones -->
    <path d="M 90 120 A 45 45 0 0 0 90 200" fill="none" stroke="#00ff41" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" filter="url(#neonGlow)"/>
    <path d="M 80 108 A 60 60 0 0 0 80 212" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
    <path d="M 70 96 A 75 75 0 0 0 70 224" fill="none" stroke="#00ff41" stroke-width="1" stroke-linecap="round" stroke-opacity="0.25"/>

    <path d="M 230 120 A 45 45 0 0 1 230 200" fill="none" stroke="#00ff41" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" filter="url(#neonGlow)"/>
    <path d="M 240 108 A 60 60 0 0 1 240 212" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
    <path d="M 250 96 A 75 75 0 0 1 250 224" fill="none" stroke="#00ff41" stroke-width="1" stroke-linecap="round" stroke-opacity="0.25"/>

    <!-- Survivor Body / Silhouette -->
    <!-- Shoulders & Survival Jacket -->
    <path d="M 80 295 C 80 255 110 235 130 230 L 160 242 L 190 230 C 210 235 240 255 240 295 Z" fill="url(#metalGrad)" stroke="#1a3b22" stroke-width="2"/>
    <!-- Collar and tactical vest straps -->
    <path d="M 125 245 L 140 300" stroke="#00ff41" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    <path d="M 195 245 L 180 300" stroke="#00ff41" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    <polygon points="150,240 170,240 165,265 155,265" fill="#132417" stroke="#00ff41" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Neck / Balaclava -->
    <path d="M 138 185 L 138 238 L 182 238 L 182 185 Z" fill="#0d1710" stroke="#17311d" stroke-width="1.5"/>

    <!-- Head / Hood outline -->
    <path d="M 116 160 C 114 110 135 90 160 90 C 185 90 206 110 204 160 C 204 195 186 215 160 215 C 134 215 116 195 116 160 Z" fill="#101c13" stroke="#25522e" stroke-width="2"/>

    <!-- Tactical Face Mask / Respirator & Visor -->
    <!-- Visor (tactical goggles) -->
    <rect x="132" y="132" width="56" height="22" rx="6" fill="url(#visorGrad)" stroke="#00ff41" stroke-width="1.5" filter="url(#neonGlow)"/>
    <line x1="135" y1="143" x2="185" y2="143" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="160" cy="143" r="3" fill="#00ff41" filter="url(#neonGlow)"/>

    <!-- Respirator / Lower Face Mask -->
    <path d="M 136 165 L 144 198 L 176 198 L 184 165 Z" fill="#09120b" stroke="#1f4427" stroke-width="1.5"/>
    <!-- Filter valve -->
    <circle cx="160" cy="182" r="8" fill="#142617" stroke="#00ff41" stroke-width="1.5"/>
    <circle cx="160" cy="182" r="4" fill="#00ff41" stroke-opacity="0.7"/>
    <line x1="160" y1="174" x2="160" y2="190" stroke="#09120b" stroke-width="1.5"/>
    <line x1="152" y1="182" x2="168" y2="182" stroke="#09120b" stroke-width="1.5"/>

    <!-- ==================== TACTICAL HEADPHONES / CASQUE D'IMMERSION ==================== -->
    <!-- Headband / Arceau du casque -->
    <path d="M 104 150 C 102 96 130 68 160 68 C 190 68 218 96 216 150" fill="none" stroke="#2a4530" stroke-width="10" stroke-linecap="round"/>
    <path d="M 108 145 C 106 100 132 74 160 74 C 188 74 214 100 212 145" fill="none" stroke="#00ff41" stroke-width="2" stroke-opacity="0.8" filter="url(#neonGlow)"/>
    <!-- Padded segments on headband -->
    <rect x="145" y="66" width="30" height="8" rx="3" fill="#122416" stroke="#00ff41" stroke-width="1"/>

    <!-- Left Ear Cup (Oreillette gauche) -->
    <g transform="translate(94, 130)">
        <rect x="0" y="0" width="22" height="48" rx="8" fill="#0b170e" stroke="#00ff41" stroke-width="2"/>
        <rect x="5" y="6" width="12" height="36" rx="4" fill="url(#metalGrad)" stroke="#1a3f21" stroke-width="1"/>
        <!-- LED indicator ring -->
        <circle cx="11" cy="24" r="6" fill="#051007" stroke="#00ff41" stroke-width="1.5"/>
        <circle cx="11" cy="24" r="3" fill="url(#headsetLight)" filter="url(#neonGlow)"/>
    </g>

    <!-- Right Ear Cup (Oreillette droite) -->
    <g transform="translate(204, 130)">
        <rect x="0" y="0" width="22" height="48" rx="8" fill="#0b170e" stroke="#00ff41" stroke-width="2"/>
        <rect x="5" y="6" width="12" height="36" rx="4" fill="url(#metalGrad)" stroke="#1a3f21" stroke-width="1"/>
        <!-- LED indicator ring -->
        <circle cx="11" cy="24" r="6" fill="#051007" stroke="#00ff41" stroke-width="1.5"/>
        <circle cx="11" cy="24" r="3" fill="url(#headsetLight)" filter="url(#neonGlow)"/>
        
        <!-- Microphone Boom (Micro tige vers la bouche) -->
        <path d="M 11 38 C 11 55 5 70 -30 68" fill="none" stroke="#00ff41" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Mic tip -->
        <rect x="-42" y="62" width="14" height="10" rx="3" fill="#08140a" stroke="#00ff41" stroke-width="1.5"/>
        <circle cx="-35" cy="67" r="2" fill="#00ff41" filter="url(#neonGlow)"/>
    </g>

    <!-- Equalizer / HUD Display at Bottom of Avatar -->
    <g transform="translate(75, 275)" filter="url(#neonGlow)">
        <rect x="0" y="0" width="170" height="24" rx="4" fill="#040d06" stroke="#00ff41" stroke-width="1" stroke-opacity="0.8"/>
        <!-- Equalizer bars -->
        <rect x="12" y="14" width="4" height="6" fill="#00ff41"/>
        <rect x="20" y="10" width="4" height="10" fill="#00ff41"/>
        <rect x="28" y="7" width="4" height="13" fill="#00ff41"/>
        <rect x="36" y="12" width="4" height="8" fill="#00ff41"/>
        <rect x="44" y="5" width="4" height="15" fill="#00ff41"/>
        <rect x="52" y="9" width="4" height="11" fill="#00ff41"/>
        <rect x="60" y="13" width="4" height="7" fill="#00ff41"/>

        <!-- Audio Frequency Status text -->
        <text x="74" y="16" fill="#00ff41" font-family="'Consolas', 'Courier New', monospace" font-size="9" font-weight="bold" letter-spacing="1">AUDIO // 2068</text>
    </g>

    <!-- HUD Reticle brackets in corners -->
    <path d="M 25 55 L 25 25 L 55 25" fill="none" stroke="#00ff41" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M 295 55 L 295 25 L 265 25" fill="none" stroke="#00ff41" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M 25 265 L 25 295 L 55 295" fill="none" stroke="#00ff41" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M 295 265 L 295 295 L 265 295" fill="none" stroke="#00ff41" stroke-width="2" stroke-opacity="0.6"/>
</svg>
